<script>
// Diminui o texto até caber na caixa (títulos longos, datas longas).
// Palavra comprida (ex.: INTERLIGAS) diminui a letra em vez de quebrar no meio; só quebra se nem no mínimo couber.
function caber(el, max, min) {
  const caixa = el.parentElement;
  let s = max;
  el.style.overflowWrap = 'normal';
  el.style.fontSize = s + 'px';
  while (s > min && (el.offsetHeight > caixa.clientHeight - 20 || el.scrollWidth > el.clientWidth + 1)) { s -= 4; el.style.fontSize = s + 'px'; }
  if (el.scrollWidth > el.clientWidth + 1) el.style.overflowWrap = 'anywhere';
}
function caberLargura(el, max, min, limite) {
  let s = max;
  el.style.fontSize = s + 'px';
  while (s > min && el.offsetWidth > limite) { s -= 2; el.style.fontSize = s + 'px'; }
}
window.ajustar = function () {
  document.querySelectorAll('[data-caber]').forEach(function (el) { const v = el.dataset.caber.split(',').map(Number); caber(el, v[0], v[1]); });
  document.querySelectorAll('[data-caber-largura]').forEach(function (el) { const v = el.dataset.caberLargura.split(',').map(Number); caberLargura(el, v[0], v[1], 860); });
  return true;
};
</script>
