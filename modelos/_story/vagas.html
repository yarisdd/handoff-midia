<script>
function caber(el, max, min) {
  const caixa = el.parentElement;
  let s = max;
  el.style.fontSize = s + 'px';
  while (s > min && (el.offsetHeight > caixa.clientHeight || el.scrollWidth > el.clientWidth + 1)) { s -= 4; el.style.fontSize = s + 'px'; }
}
window.ajustar = function () {
  document.querySelectorAll('[data-caber]').forEach(function (el) { const v = el.dataset.caber.split(',').map(Number); caber(el, v[0], v[1]); });
  return true;
};
</script>
