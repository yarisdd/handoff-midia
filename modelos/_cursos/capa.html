<style>

.t2 small{display:block;font-size:0.62em;color:#FFFFFF;margin-bottom:6px}
.caixa{position:absolute;left:96px;right:96px;bottom:118px;transform:rotate(-1.5deg);background:#FFFFFF;color:var(--marinho);border-radius:22px;

<body>

<svg class="estrela" style="left:40px;top:1010px;transform:rotate(-12deg)" width="120" height="120" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 61.8,36.5 96,36.9 68.9,57.8 78.8,90.6 50,71 21.2,90.6 31.1,57.8 4,36.9 38.2,36.5" fill="{{COR_ESTRELA}}" stroke="#0A2472" stroke-width="5" stroke-linejoin="round"/><polygon points="50,15 58.9,40 85,40.4 64.4,56.3 71.9,81.3 50,66.2 28.1,81.3 35.6,56.3 15,40.4 41.1,40" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-dasharray="5 5" stroke-linejoin="round"/></svg>

<div class="mont adesivo" style="position:absolute;left:170px;top:200px;width:180px;height:180px;border-radius:44px;background:var(--azul);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:150px;line-height:1;transform:rotate(-8deg)">h</div>

<div class="titulo">
<div class="mont contorno t1">Cursos<br>gratuitos</div>
<div class="mont contorno t2" data-caber="112,56"><small>de</small>{{TEMA}}</div>
</div>

<div class="caixa">
<div class="l1">que todo estudante de <b>medicina</b> deveria fazer</div>
<div class="l2">(online e com certificado)</div>
</div>

<div class="rodape"><div>@handoff.med</div>
<div style="display:flex;align-items:center;gap:12px;color:var(--limao)">Arraste
<svg width="50" height="22" viewBox="0 0 56 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h50M42 2l10 10-10 10"></path></svg></div></div>
</div>
<script>
function caber(el, max, min) {
  let s = max;
  el.style.fontSize = s + 'px';
  // Tema comprido diminui a letra; no máximo duas linhas.
  const caixa = el.parentElement;
  while (s > min && (el.offsetHeight > s * 2.9 || el.scrollWidth > el.clientWidth + 1 || caixa.scrollHeight > caixa.clientHeight)) { s -= 4; el.style.fontSize = s + 'px'; }
}
window.ajustar = function () {
  document.querySelectorAll('[data-caber]').forEach(function (el) { const v = el.dataset.caber.split(',').map(Number); caber(el, v[0], v[1]); });
  return true;
};
</script>
