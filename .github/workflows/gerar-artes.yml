# Gera as artes dos eventos do Handoff a partir da aba "Publicação" da planilha.
# Também gera os stories diários da aba "Stories" (scripts/gerar_stories.py) e os carrosséis
# diários de cursos gratuitos da aba "Cursos — Carrosséis" (scripts/gerar_cursos.py).
# Roda duas vezes por hora (e pelo botão "Run workflow" em Actions). Só instala o navegador
# quando há evento com arte nova para fazer. As imagens vão para posts/auto/<ID>/ e o
# Apps Script usa os links públicos delas para publicar no Instagram.
name: Gerar artes dos eventos

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["modelos/_evento/**", "modelos/_story/**", "modelos/_cursos/**", "scripts/gerar_eventos.py", "scripts/gerar_stories.py", "scripts/gerar_cursos.py", ".github/workflows/gerar-artes.yml"]

permissions:
  contents: write

concurrency:
  group: gerar-artes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar a fila de publicação
        run: |
          curl -sSfL "https://docs.google.com/spreadsheets/d/1CKy25A_WejA8AvJMhS4jfxIJnngdGHLKK7fP7tgpKgA/export?format=csv&gid=251176273" -o "$RUNNER_TEMP/fila.csv"

      - name: Ver se tem arte nova para gerar
        id: fila
        # Mesma regra do gerador: textos mudaram ou o visual (ESTILO) mudou.
        run: python scripts/gerar_eventos.py --csv "$RUNNER_TEMP/fila.csv" --checar >> "$GITHUB_OUTPUT"

      - name: Ver se tem story diário novo (aba Stories)
        id: stories
        run: echo "tem=$(python scripts/gerar_stories.py --checar | sed 's/^tem=//')" >> "$GITHUB_OUTPUT"

      - name: Ver se tem carrossel de cursos novo (aba Cursos — Carrosséis)
        id: cursos
        run: echo "tem=$(python scripts/gerar_cursos.py --checar | sed 's/^tem=//')" >> "$GITHUB_OUTPUT"

      - name: Instalar o navegador
        if: steps.fila.outputs.tem == '1' || steps.stories.outputs.tem == '1' || steps.cursos.outputs.tem == '1'
        run: |
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium

      - name: Gerar as artes
        if: steps.fila.outputs.tem == '1'
        run: python scripts/gerar_eventos.py --csv "$RUNNER_TEMP/fila.csv"

      - name: Gerar os stories diários
        if: steps.stories.outputs.tem == '1'
        run: python scripts/gerar_stories.py

      - name: Gerar os carrosséis de cursos
        if: steps.cursos.outputs.tem == '1'
        run: python scripts/gerar_cursos.py

      - name: Salvar no repositório
        if: steps.fila.outputs.tem == '1' || steps.stories.outputs.tem == '1' || steps.cursos.outputs.tem == '1'
        run: |
          git config user.name "handoff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/auto posts/stories posts/cursos
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Artes automáticas (eventos, stories e cursos)"
          git pull --rebase --quiet
          git push
